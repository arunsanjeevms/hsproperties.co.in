<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    HS Properties icon set.
    Geometric, stroke-based, 24x24, drawn on a consistent 1.5 stroke so they
    read as one architectural family. Colour is inherited via currentColor;
    size via the .icon class. Referenced as <use href="#icon-name">.
  -->

